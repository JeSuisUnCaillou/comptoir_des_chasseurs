name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Annule les anciens runs d'une PR, mais jamais ceux de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build et tests e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comptoir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comptoir_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Les migrations correspondent au schéma
        run: npx drizzle-kit check && npx drizzle-kit generate --name ci-check && git diff --exit-code --stat -- drizzle && test -z "$(git status --porcelain -- drizzle)"
      - run: npm run db:migrate
      - name: Scripts de reprise de l'ancienne app
        run: npm run test:legacy
      - run: npm run build
      # The system packages come from the Ubuntu mirrors, which GitHub sometimes
      # can't reach (2026-11-11): the runner image already has what Chromium
      # needs to run, so fall back to the browser alone rather than fail.
      - run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
