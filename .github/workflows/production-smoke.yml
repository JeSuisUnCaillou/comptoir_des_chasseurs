# Vercel deploys main to production on its own (Git integration).
# When Vercel reports the production deployment as successful, the e2e
# tests run again against the live URL.
name: Tests e2e en production

on:
  deployment_status:

jobs:
  smoke:
    name: Tests e2e sur la prod
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
